-monospace,monospace">S0=0</text><text x="130" y="68" font-size="13" font-weight="700" fill="var(--text)" text-anchor="middle" font-family="system-ui">MUX</text></svg></div><div class="stack-2"><p class="goal">Decoder</p><svg viewBox="0 0 240 190" width="240" style="max-width:100%;height:auto" role="img" aria-label="2-to-4 decoder, input 10, D2 is 1"><rect x="70" y="20" width="90" height="150" rx="6" fill="var(--surface)" stroke="var(--text)" stroke-width="2"/><text x="115" y="100" font-size="13" font-weight="700" fill="var(--text)" text-anchor="middle" font-family="system-ui">2→4 DEC</text><path d="M40 70 H70" stroke="var(--text-muted)" stroke-width="2"/><text x="4" y="75" font-size="13" font-weight="700" fill="var(--text)" font-family="ui-monospace,monospace">A=1</text><path d="M40 120 H70" stroke="var(--text-muted)" stroke-width="2"/><text x="4" y="125" font-size="13" font-weight="700" fill="var(--text)" font-family="ui-monospace,monospace">B=0</text><path d="M160 45 H205" stroke="var(--text-muted)" stroke-width="2"/><text x="209" y="50" font-size="13" font-weight="700" fill="var(--text)" font-family="ui-monospace,monospace">D0=0</text><path d="M160 80 H205" stroke="var(--text-muted)" stroke-width="2"/><text x="209" y="85" font-size="13" font-weight="700" fill="var(--text)" font-family="ui-monospace,monospace">D1=0</text><path d="M160 115 H205" stroke="var(--signal-high)" stroke-width="3"/><text x="209" y="120" font-size="13" font-weight="700" fill="var(--text)" font-family="ui-monospace,monospace">D2=1</text><path d="M160 150 H205" stroke="var(--text-muted)" stroke-width="2"/><text x="209" y="155" font-size="13" font-weight="700" fill="var(--text)" font-family="ui-monospace,monospace">D3=0</text></svg></div></div></div><div class="stack-2"><p class="goal">Predict first: with S1 S0 = 10, which input reaches Y?</p><div class="chips" role="radiogroup"><span class="chip">I0</span><span class="chip">I1</span><span class="chip sel">I2</span><span class="chip">I3</span
