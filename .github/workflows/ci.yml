name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to a PR branch cancels the superseded run. Pushes to main each get their own group,
# so a quick second merge never cancels the first one's verification (cancelled runs email the owner).
concurrency:
  group: ci-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: true

jobs:
  # PRs that only touch non-runtime files (agent state, docs, shared policy, Markdown) skip the
  # build and browser jobs. Skipped jobs count as passed for the required checks, so main stays
  # protected. Pushes to main always run everything.
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.files.outputs.code }}
    steps:
      - id: files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then echo "code=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          files=$(gh api --paginate "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" -q '.[].filename')
          echo "$files"
          if [ -z "$files" ]; then echo "code=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if echo "$files" | grep -qvE '^(agents/|docs/|shared/|\.claude/agents/|[^/]+\.md$)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
            echo "Docs/state-only change: build and browser checks skipped." >> "$GITHUB_STEP_SUMMARY"
          fi

  check:
    name: typecheck · lint · unit · build
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      - name: First-load JS per route (report only)
        run: node scripts/size-report.mjs out >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: out
          retention-days: 3

  smoke:
    name: browser smoke
    runs-on: ubuntu-latest
    needs: [changes, check]
    if: needs.changes.outputs.code == 'true'
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: out
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CI: "1"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 3
