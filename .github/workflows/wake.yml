# Idempotent wake signals (ADR-0006). Applies a label describing who should act next.
# Labels are only added when absent, so re-running never duplicates work.
name: Wake

on:
  pull_request:
    types: [opened, reopened, ready_for_review, closed]
  pull_request_review:
    types: [submitted]
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  pull-requests: write
  issues: write

jobs:
  wake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const WAKE = ['wake:reviewer', 'wake:qa', 'wake:tech-lead', 'wake:product-manager'];
            async function setWake(number, label) {
              const { data: current } = await github.rest.issues.listLabelsOnIssue({ ...context.repo, issue_number: number });
              const names = current.map(l => l.name);
              if (names.includes(label)) return;               // idempotent
              for (const old of names.filter(n => WAKE.includes(n))) {
                await github.rest.issues.removeLabel({ ...context.repo, issue_number: number, name: old }).catch(() => {});
              }
              await github.rest.issues.addLabels({ ...context.repo, issue_number: number, labels: [label] });
            }
            const ev = context.eventName;
            if (ev === 'pull_request') {
              const pr = context.payload.pull_request;
              if (context.payload.action === 'closed') {
                if (pr.merged) await setWake(pr.number, 'wake:product-manager');
              } else if (!pr.draft) {
                await setWake(pr.number, 'wake:reviewer');
              }
            } else if (ev === 'pull_request_review') {
              if (context.payload.review.state === 'approved') {
                await setWake(context.payload.pull_request.number, 'wake:qa');
              }
            } else if (ev === 'workflow_run') {
              const run = context.payload.workflow_run;
              if (run.conclusion !== 'success') return;
              for (const pr of run.pull_requests || []) {
                const { data: labels } = await github.rest.issues.listLabelsOnIssue({ ...context.repo, issue_number: pr.number });
                if (labels.some(l => l.name === 'qa:passed')) await setWake(pr.number, 'wake:tech-lead');
              }
            }
